services:
  # 1. Base de Datos MySQL
  db:
    image: mysql:8.0
    container_name: datahorse-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 2. Backend FastAPI
  backend:
    build: ./backend
    container_name: datahorse-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads

  # 3. Frontend Angular (Nginx)
  frontend:
    build: ./frontend
    container_name: datahorse-frontend
    restart: always
    ports:
      - "80:8080"
    depends_on:
      - backend

# Volumen para que los datos de MySQL no se borren al apagar Docker
volumes:
  mysql_data:
