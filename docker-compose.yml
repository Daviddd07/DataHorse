services:
  # 1. Base de Datos MySQL
  db:
    image: mysql:8.0
    container_name: datahorse-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 2. Backend FastAPI
  backend:
    build: ./backend
    container_name: datahorse-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      # Documentos de respaldo (privados: la API los entrega solo con sesión)
      - ./backend/documentos:/app/documentos

  # 3. Frontend Angular (Nginx)
  frontend:
    build: ./frontend
    container_name: datahorse-frontend
    restart: always
    ports:
      - "80:8080"
    depends_on:
      - backend

  # 4. Grafana (logs). La conexión a MySQL y el dashboard se crean solos desde ./grafana.
  #    Primer inicio: usuario admin / admin; Grafana pide cambiar la contraseña.
  grafana:
    image: grafana/grafana-oss:11.3.0
    container_name: datahorse-grafana
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_NAME: ${DB_NAME}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/logs-datahorse.json
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

# Volúmenes para que los datos de MySQL y Grafana no se borren al apagar Docker
volumes:
  mysql_data:
  grafana_data:
