# Conexión de Grafana a MySQL (se crea sola al arrancar el contenedor).
# Usa el usuario de solo lectura de init-db/03_grafana_lector.sh.
# La contraseña viene de GRAFANA_DB_PASSWORD (.env de la raíz); nunca se escribe aquí.
apiVersion: 1

datasources:
  - name: DataHorse MySQL
    uid: datahorse-mysql
    type: mysql
    access: proxy
    url: db:3306
    user: grafana_lector
    jsonData:
      database: ${DB_NAME}
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      timezone: UTC
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
    isDefault: true
    editable: false
