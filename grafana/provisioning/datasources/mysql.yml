# Conexión de Grafana a MySQL (se crea sola al arrancar el contenedor).
# Usa el usuario de solo lectura de init-db/zz_grafana_lector.sql.
apiVersion: 1

datasources:
  - name: DataHorse MySQL
    uid: datahorse-mysql
    type: mysql
    access: proxy
    url: db:3306
    user: grafana_lector
    jsonData:
      database: ${DB_NAME}
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      timezone: UTC
    secureJsonData:
      password: <GRAFANA_DB_PASSWORD>
    isDefault: true
    editable: false
